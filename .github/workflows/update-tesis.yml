name: Actualizar tesis

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-tesis
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/update-tesis.mjs

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tesis.json
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que subir"
            exit 0
          fi
          git commit -m "Actualizar tesis"
          for intento in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push rechazado, reintentando ($intento)..."
            sleep 5
          done
          echo "No se pudo subir tesis.json tras varios intentos"
          exit 1
